name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - "data/**/*.dvc"
      - "src/**/*.py"
      - "params.yaml"
      - "requirements.txt"
      - ".github/workflows/mlops.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Authenticate to Azure Blob Storage
        env:
          RAW_CONNECTION_STRING: ${{ secrets.CLOUD_CREDENTIALS }}
          AZURE_STORAGE_CONTAINER_SECRET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          CONNECTION_STRING="$(printf '%s' "$RAW_CONNECTION_STRING" | tr -d '\r\n')"
          case "$CONNECTION_STRING" in
            DefaultEndpointsProtocol=*) ;;
            *) echo "CLOUD_CREDENTIALS is not a valid Azure connection string." >&2; exit 1 ;;
          esac
          echo "AZURE_STORAGE_CONNECTION_STRING=$CONNECTION_STRING" >> "$GITHUB_ENV"
          echo "AZURE_STORAGE_CONTAINER=$AZURE_STORAGE_CONTAINER_SECRET" >> "$GITHUB_ENV"
          dvc remote modify --local myremote connection_string "$CONNECTION_STRING"
      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv data/eval.csv
      - name: Train model
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
          MLFLOW_ARTIFACT_ROOT: ./mlartifacts
        run: python src/train.py
      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          echo "accuracy=$ACC" >> "$GITHUB_OUTPUT"
      - name: Upload model to Azure Blob Storage
        run: |
          python - <<'PY'
          import os
          from azure.storage.blob import BlobServiceClient

          service = BlobServiceClient.from_connection_string(
              os.environ["AZURE_STORAGE_CONNECTION_STRING"]
          )
          blob = service.get_blob_client(
              container=os.environ["AZURE_STORAGE_CONTAINER"],
              blob="models/latest/model.pkl",
          )
          with open("models/model.pkl", "rb") as model_file:
              blob.upload_blob(model_file, overwrite=True)
          PY
      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json

  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check eval gate
        run: |
          python - <<'PY'
          accuracy = float("${{ needs.train.outputs.accuracy }}")
          threshold = 0.68
          if accuracy < threshold:
              raise SystemExit(
                  f"FAILED: accuracy {accuracy:.4f} < {threshold:.2f}. Deployment cancelled."
              )
          print(f"PASSED: accuracy {accuracy:.4f} >= {threshold:.2f}. Deploying model.")
          PY

  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            sleep 5
            curl --fail --silent --show-error http://localhost:8000/health
